services:
  - type: web
    name: flask-event-admin
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: PORT
        value: 5000
      - key: BASE_URL
        sync: false # Set this in the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DRIVE_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true
