<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirDrop Transfer - {{ event.name }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            overflow: hidden;
        }

        /* Glassmorphism Header */
        .header {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 5px 0;
        }

        p.subtitle {
            font-size: 14px;
            color: #8E8E93;
            margin: 0;
        }

        /* Countdown Timer */
        .countdown-timer {
            margin-top: 15px;
            padding: 12px 20px;
            background: rgba(0, 122, 255, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(0, 122, 255, 0.3);
        }

        .countdown-timer.warning {
            background: rgba(255, 159, 10, 0.1);
            border-color: rgba(255, 159, 10, 0.5);
        }

        .countdown-timer.critical {
            background: rgba(255, 59, 48, 0.1);
            border-color: rgba(255, 59, 48, 0.5);
            animation: pulse-warning 2s ease-in-out infinite;
        }

        @keyframes pulse-warning {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .countdown-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8E8E93;
            margin-bottom: 5px;
        }

        .countdown-time {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .countdown-timer.warning .countdown-time {
            color: #FF9F0A;
        }

        .countdown-timer.critical .countdown-time {
            color: #FF3B30;
        }

        /* Main Interaction Area */
        .beam-zone {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        /* Radar Animation */
        .radar-circle {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(0, 122, 255, 0.5);
            opacity: 0;
            transform: scale(0.5);
        }

        .animating .radar-circle {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .animating .radar-circle:nth-child(2) {
            animation-delay: 0.5s;
        }

        .animating .radar-circle:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        /* Camera/Profile Avatar */
        .avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1C1C1E;
            overflow: hidden;
            position: relative;
            z-index: 2;
            border: 4px solid #000;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        #video,
        #capturedImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Status Text */
        #statusText {
            font-size: 17px;
            color: #8E8E93;
            text-align: center;
            height: 30px;
            margin-bottom: 20px;
        }

        /* Action Buttons */
        .action-button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 28px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: transform 0.1s, background 0.2s;
            margin-bottom: 12px;
        }

        .action-button:active {
            transform: scale(0.98);
            background: #0056b3;
        }

        .secondary-button {
            background: rgba(255, 255, 255, 0.1);
            color: #007AFF;
        }

        /* Incoming Transfer Card */
        .transfer-card {
            background: rgba(28, 28, 30, 0.9);
            border-radius: 20px;
            padding: 24px;
            width: 300px;
            text-align: center;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .transfer-card.visible {
            display: block;
            animation: popIn 0.3s ease forwards;
        }

        @keyframes popIn {
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .transfer-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .transfer-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .transfer-subtitle {
            font-size: 13px;
            color: #8E8E93;
            margin-bottom: 24px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .preview-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            background: #333;
        }
    </style>
</head>

<body>
    <!-- GetPhotos Branding -->
    <div
        style="text-align: center; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin-bottom: 20px;">
        <h1 style="color: white; font-size: 28px; margin: 0; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">
            GetPhotos</h1>
        <p style="color: rgba(255,255,255,0.9); font-size: 13px; margin: 5px 0 0;">AI-Powered Event Photography</p>
    </div>

    <div class="header" id="header">
        <h1>AirDrop Station</h1>
        <p class="subtitle">Connected to {{ event.name }}</p>

        <!-- Countdown Timer -->
        <div class="countdown-timer" id="countdownTimer" style="display: none;">
            <div class="countdown-label">Event Expires In</div>
            <div class="countdown-time" id="countdownTime">Loading...</div>
        </div>
    </div>

    <!-- Scanning Visual -->
    <div class="beam-zone" id="beamZone">
        <div class="radar-circle"></div>
        <div class="radar-circle"></div>
        <div class="radar-circle"></div>

        <div class="avatar-container" onclick="openCamera()">
            <!-- Default Placeholder Icon -->
            <div id="defaultIcon"
                style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#2C2C2E;">
                <span style="font-size:40px;">👤</span>
            </div>
            <!-- Live Camera Feed -->
            <video id="video" autoplay playsinline style="display:none"></video>
            <!-- Captured Snapshot -->
            <canvas id="canvas" style="display:none"></canvas>
            <img id="capturedImage" style="display:none">
        </div>
    </div>

    <div id="statusText">Tap circle to scan face</div>

    <!-- Initial State Controls -->
    <div id="controls">
        <button class="action-button" onclick="openCamera()" id="scanBtn">Scan to Find</button>
    </div>

    <!-- Capture State Controls -->
    <div id="captureControls" style="display:none">
        <button class="action-button" onclick="takeSnapshot()">Start Search</button>
        <button class="action-button secondary-button" onclick="resetCamera()">Cancel</button>
    </div>

    <!-- Success Modal: "AirDrop Request" -->
    <div class="transfer-card" id="transferCard">
        <div class="transfer-icon">📡</div>
        <div class="transfer-title">Photos Found</div>
        <div class="transfer-subtitle">Receiving <span id="photoCount">0</span> photos...</div>

        <button class="action-button" onclick="acceptTransfer()">Accept</button>
        <button class="action-button secondary-button" onclick="resetApp()">Decline</button>
    </div>

    <!-- Results Grid (Hidden initially, shown after Accept) -->
    <div id="galleryView" style="display:none; width:100%; max-width:400px;">
        <h3 style="margin-left:5px">Saved to Downloads</h3>
        <div class="preview-grid" id="photosGrid"></div>
        <button class="action-button secondary-button" style="margin-top:20px" onclick="resetApp()">Done</button>
    </div>

    <script>
        let stream = null;
        let isScanning = false;

        async function openCamera() {
            if (stream) return; // Prevent double open
            try {
                document.getElementById('defaultIcon').style.display = 'none';
                document.getElementById('video').style.display = 'block';
                document.getElementById('statusText').innerText = "Position face in circle...";

                document.getElementById('controls').style.display = 'none';
                document.getElementById('captureControls').style.display = 'block';

                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('video');
                video.srcObject = stream;
            } catch (err) {
                alert('Camera access needed to match your face.');
                resetCamera();
            }
        }

        function resetCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            document.getElementById('video').style.display = 'none';
            document.getElementById('defaultIcon').style.display = 'flex';
            document.getElementById('controls').style.display = 'block';
            document.getElementById('captureControls').style.display = 'none';
            document.getElementById('statusText').innerText = "Tap circle to scan face";
            document.getElementById('beamZone').classList.remove('animating');
            document.getElementById('capturedImage').style.display = 'none';
        }

        async function takeSnapshot() {
            // UI Transition
            document.getElementById('beamZone').classList.add('animating');
            document.getElementById('statusText').innerText = "Searching nearby...";
            document.getElementById('captureControls').style.display = 'none';

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            // Stop video, switch to captured frame for effect
            const imageUrl = canvas.toDataURL('image/jpeg');
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            document.getElementById('video').style.display = 'none';
            document.getElementById('capturedImage').src = imageUrl;
            document.getElementById('capturedImage').style.display = 'block';

            canvas.toBlob(sendForMatching, 'image/jpeg');
        }

        async function sendForMatching(blob) {
            const formData = new FormData();
            formData.append('selfie', blob, 'selfie.jpg');

            try {
                const response = await fetch('/api/events/{{ event.id }}/find_me', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                document.getElementById('beamZone').classList.remove('animating');

                if (result.matches && result.matches.length > 0) {
                    showTransferRequest(result.matches);
                } else {
                    document.getElementById('statusText').innerText = "No one found nearby.";
                    setTimeout(resetCamera, 2000);
                }
            } catch (e) {
                alert('Connection lost. Try again.');
                resetCamera();
            }
        }

        let foundPhotos = [];

        function showTransferRequest(photos) {
            foundPhotos = photos;
            document.getElementById('photoCount').innerText = photos.length;
            document.getElementById('transferCard').classList.add('visible');
            document.getElementById('statusText').innerText = "Connection established";
        }

        function acceptTransfer() {
            document.getElementById('transferCard').classList.remove('visible');
            document.getElementById('header').style.display = 'none'; // Hide top to focus on content
            document.getElementById('beamZone').style.display = 'none';
            document.getElementById('statusText').style.display = 'none';
            document.getElementById('galleryView').style.display = 'block';

            const grid = document.getElementById('photosGrid');
            grid.innerHTML = '';

            foundPhotos.forEach(url => {
                // Create visible image
                const img = document.createElement('img');
                img.src = url;
                img.className = 'preview-img';

                // Wrap in download link
                const link = document.createElement('a');
                link.href = url;
                link.download = ''; // Trigger download
                link.appendChild(img);
                grid.appendChild(link);

                // Auto-trigger download (simulating AirDrop)
                // Note: Browsers may block multiple popups.
            });
        }

        function resetApp() {
            window.location.reload();
        }

        // Countdown Timer Logic
        let expirationTime = null;

        async function fetchTimeRemaining() {
            try {
                const response = await fetch('/api/events/{{ event.id }}/time-remaining');
                const data = await response.json();

                if (data.expired) {
                    showExpiredMessage();
                    return;
                }

                // Calculate expiration timestamp
                const now = new Date();
                const totalSeconds = (data.hours * 3600) + (data.minutes * 60);
                expirationTime = new Date(now.getTime() + (totalSeconds * 1000));

                // Show timer
                document.getElementById('countdownTimer').style.display = 'block';

                // Start updating
                updateCountdown();
                setInterval(updateCountdown, 1000);
            } catch (error) {
                console.error('Error fetching time remaining:', error);
            }
        }

        function updateCountdown() {
            if (!expirationTime) return;

            const now = new Date();
            const diff = expirationTime - now;

            if (diff <= 0) {
                showExpiredMessage();
                return;
            }

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            // Format time
            let timeText = '';
            if (hours > 0) {
                timeText = `${hours}h ${minutes}m ${seconds}s`;
            } else if (minutes > 0) {
                timeText = `${minutes}m ${seconds}s`;
            } else {
                timeText = `${seconds}s`;
            }

            document.getElementById('countdownTime').textContent = timeText;

            // Update visual state
            const timer = document.getElementById('countdownTimer');
            timer.className = 'countdown-timer';

            if (hours < 1) {
                timer.classList.add('critical');
            } else if (hours < 6) {
                timer.classList.add('warning');
            }
        }

        function showExpiredMessage() {
            const timer = document.getElementById('countdownTimer');
            timer.className = 'countdown-timer critical';
            timer.style.display = 'block';
            document.getElementById('countdownTime').textContent = 'Event Expired';
        }

        // Initialize countdown on page load
        fetchTimeRemaining();
    </script>
</body>

</html>
