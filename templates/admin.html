<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetPhotos - Event Admin Panel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient-start: #E8F5FE;
            --bg-gradient-end: #F0E6FF;
            --primary: #1A73E8;
            --primary-hover: #1557B0;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.3);
            --text-primary: #1F1F1F;
            --text-secondary: #5F6368;
            --shadow: 0 1px 3px rgba(60, 64, 67, 0.15), 0 4px 8px rgba(60, 64, 67, 0.1);
            --shadow-hover: 0 2px 6px rgba(60, 64, 67, 0.2), 0 8px 16px rgba(60, 64, 67, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 1rem;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
        }

        .form-section,
        .events-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-section:hover,
        .events-section:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            letter-spacing: -0.3px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.2s;
            color: var(--text-primary);
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 24px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 1px 3px rgba(26, 115, 232, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 2px 8px rgba(26, 115, 232, 0.4);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(95, 99, 104, 0.1);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: rgba(95, 99, 104, 0.2);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .event-card {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(60, 64, 67, 0.15);
        }

        .event-card h3 {
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .event-meta {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .event-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .qr-code-container {
            margin-top: 1rem;
            text-align: center;
        }

        .qr-code-container img {
            max-width: 200px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            text-align: center;
            color: var(--text-secondary);
        }

        footer strong {
            color: var(--primary);
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            header h1 {
                font-size: 2rem;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📸 GetPhotos Admin Panel</h1>
            <p>Professional AI-Powered Event Photo Management</p>
        </header>

        <!-- Event Creation Form -->
        <section class="form-section">
            <h2>Create New Event</h2>
            <form id="eventForm">
                <div class="form-group">
                    <label for="eventName">Event Name *</label>
                    <input type="text" id="eventName" required placeholder="Tech Conference 2025">
                </div>

                <div class="form-group">
                    <label for="eventDate">Date & Time *</label>
                    <input type="datetime-local" id="eventDate" required">
                </div>

                <div class="form-group">
                    <label for="eventLocation">Location *</label>
                    <input type="text" id="eventLocation" required placeholder="San Francisco Convention Center">
                </div>

                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" rows="4" placeholder="Event details..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Create Event & Generate QR Code</button>
            </form>
        </section>

        <!-- Events List -->
        <section class="events-section">
            <h2>All Events</h2>
            <div id="eventsList" class="events-grid">
                <p class="loading">Loading events...</p>
            </div>
        </section>

        <footer
            style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0; text-align: center; color: #718096;">
            <p><strong>GetPhotos</strong> - Professional AI-Powered Event Photography</p>
            <p style="font-size: 12px; margin-top: 5px;">Instant photo delivery with face recognition technology</p>
        </footer>
    </div>

    <script>
        // Load events on page load
        document.addEventListener('DOMContentLoaded', loadEvents);

        // Handle form submission
        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const eventData = {
                name: document.getElementById('eventName').value,
                date: document.getElementById('eventDate').value,
                location: document.getElementById('eventLocation').value,
                description: document.getElementById('eventDescription').value
            };

            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(eventData)
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Event created successfully!');
                    document.getElementById('eventForm').reset();
                    loadEvents(); // Reload events list
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error creating event: ' + error.message);
            }
        });

        // Load and display events
        async function loadEvents() {
            try {
                const response = await fetch('/api/events');
                const result = await response.json();

                const eventsList = document.getElementById('eventsList');

                if (result.events && result.events.length > 0) {
                    eventsList.innerHTML = result.events.map(event => `
                        <div class="event-card">
                            <div class="event-info">
                                <h3>${event.name}</h3>
                                <p class="event-date">📅 ${formatDate(event.date)}</p>
                                <p class="event-location">📍 ${event.location}</p>
                                ${event.description ? `<p class="event-description">${event.description}</p>` : ''}
                            </div>
                            <div class="event-qr">
                                <img src="/api/events/${event.id}/qr" alt="QR Code for ${event.name}" class="qr-code">
                                <div class="event-actions">
                                    <a href="/api/events/${event.id}/qr" download="event_${event.id}_qr.png" class="btn btn-small">Download QR</a>
                                    <a href="/event/${event.id}" target="_blank" class="btn btn-small btn-secondary">View Event</a>
                                    <button onclick="document.getElementById('upload_${event.id}').click()" class="btn btn-small btn-secondary">📷 Upload Photos</button>
                                    <input type="file" id="upload_${event.id}" multiple accept="image/*" style="display:none" onchange="uploadPhotos(${event.id}, this)">
                                    <button onclick="document.getElementById('zip_${event.id}').click()" class="btn btn-small btn-secondary">📦 Upload ZIP</button>
                                    <input type="file" id="zip_${event.id}" accept=".zip" style="display:none" onchange="uploadZip(${event.id}, this)">
                                    <button onclick="deleteEvent(${event.id})" class="btn btn-small btn-danger">Delete</button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    eventsList.innerHTML = '<p class="no-events">No events created yet. Create your first event above!</p>';
                }
            } catch (error) {
                document.getElementById('eventsList').innerHTML = '<p class="error">Error loading events</p>';
            }
        }

        // Helper to resize image
        function resizeImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            }));
                        }, 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Upload photos
        async function uploadPhotos(eventId, input) {
            if (input.files.length === 0) return;

            const btn = input.previousElementSibling;
            const originalText = btn.innerText;
            btn.innerText = 'Compressing...';
            btn.disabled = true;

            try {
                const formData = new FormData();
                for (let i = 0; i < input.files.length; i++) {
                    const file = input.files[i];
                    // Resize/Compress before sending
                    const compressedFile = await resizeImage(file);
                    formData.append('photos', compressedFile);
                }

                btn.innerText = 'Uploading...';

                const response = await fetch(`/api/events/${eventId}/photos`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    let msg = `Success: ${result.message}`;
                    if (result.cloud_sync_active === false) {
                        msg += "\n\n⚠️ WARNING: Photos were NOT saved to Google Drive. Please go to /auth and log in again to enable permanent storage.";
                    }
                    alert(msg);
                    loadEvents();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error uploading photos: ' + error.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
                input.value = ''; // clear input
            }
        }

        // Upload ZIP file
        async function uploadZip(eventId, input) {
            if (!input.files || input.files.length === 0) return;

            const zipFile = input.files[0];
            const btn = input.previousElementSibling;
            const originalText = btn.innerText;

            btn.innerText = 'Extracting ZIP...';
            btn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('zipfile', zipFile);

                const response = await fetch(`/api/events/${eventId}/photos/zip`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    let msg = `Success: ${result.message}`;
                    if (result.cloud_sync_active === false) {
                        msg += "\n\n⚠️ WARNING: Photos were NOT saved to Google Drive. Please go to /auth and log in again to enable permanent storage.";
                    }
                    alert(msg);
                    loadEvents();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error uploading ZIP: ' + error.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
                input.value = ''; // clear input
            }
        }

        // Delete event
        async function deleteEvent(eventId) {
            if (!confirm('Are you sure you want to delete this event?')) {
                return;
            }

            try {
                const response = await fetch(`/api/events/${eventId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Event deleted successfully');
                    loadEvents();
                } else {
                    const result = await response.json();
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error deleting event: ' + error.message);
            }
        }

        // Format date for display
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('en-US', {
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    </script>
</body>

</html>
