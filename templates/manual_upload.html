<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Upload - GetPhotos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #eef2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e0e7ff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        #fileInput {
            display: none;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .photo-preview {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-preview .remove {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar {
            height: 8px;
            background: #e0e7ff;
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            width: 0%;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #666;
            display: none;
        }

        .qr-container {
            display: none;
            text-align: center;
            margin-top: 30px;
            padding: 30px;
            background: #f8f9ff;
            border-radius: 15px;
        }

        .qr-container img {
            max-width: 250px;
            margin: 20px auto;
        }

        .success-message {
            color: #28a745;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📸 Manual Upload</h1>
        <p class="subtitle">Select photos from your device to create an event</p>

        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📁</div>
            <h3>Click to select photos</h3>
            <p style="color: #999; margin-top: 10px;">or drag and drop here</p>
            <p style="color: #999; font-size: 14px;">Supports: JPG, PNG (max 500 photos)</p>
        </div>

        <input type="file" id="fileInput" multiple accept="image/*">

        <div class="photo-grid" id="photoGrid"></div>

        <button class="upload-btn" id="uploadBtn" onclick="uploadPhotos()" disabled>
            🚀 Upload & Generate QR Code
        </button>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status" id="status"></div>

        <div class="qr-container" id="qrContainer">
            <div class="success-message">✅ Success!</div>
            <p>Event created! Share this QR code with guests:</p>
            <img id="qrImage" src="" alt="QR Code">
            <p style="margin-top: 20px;">
                <a href="/admin" style="color: #667eea;">View All Events</a>
            </p>
        </div>
    </div>

    <script>
        let selectedFiles = [];

        // File input handler
        document.getElementById('fileInput').addEventListener('change', function (e) {
            handleFiles(e.target.files);
        });

        // Drag and drop
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            selectedFiles = Array.from(files).filter(f => f.type.startsWith('image/'));

            if (selectedFiles.length > 500) {
                alert('Maximum 500 photos allowed');
                selectedFiles = selectedFiles.slice(0, 500);
            }

            displayPhotos();
            document.getElementById('uploadBtn').disabled = selectedFiles.length === 0;
        }

        function displayPhotos() {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'photo-preview';
                    div.innerHTML = `
                        <img src="${e.target.result}">
                        <button class="remove" onclick="removePhoto(${index})">×</button>
                    `;
                    grid.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        function removePhoto(index) {
            selectedFiles.splice(index, 1);
            displayPhotos();
            document.getElementById('uploadBtn').disabled = selectedFiles.length === 0;
        }

        async function uploadPhotos() {
            if (selectedFiles.length === 0) return;

            const uploadBtn = document.getElementById('uploadBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const status = document.getElementById('status');

            uploadBtn.disabled = true;
            progressBar.style.display = 'block';
            status.style.display = 'block';
            status.textContent = 'Uploading photos...';

            const photoIds = [];
            const eventName = `Event_${new Date().getTime()}`;

            // Upload each photo
            for (let i = 0; i < selectedFiles.length; i++) {
                const formData = new FormData();
                formData.append('photo', selectedFiles[i]);
                formData.append('event_name', eventName);

                try {
                    const response = await fetch('/api/upload/manual', {
                        method: 'POST',
                        body: formData,
                        credentials: 'include'
                    });

                    const data = await response.json();
                    if (data.public_id) {
                        photoIds.push(data.public_id);
                    }

                    // Update progress
                    const progress = ((i + 1) / selectedFiles.length) * 100;
                    progressFill.style.width = progress + '%';
                    status.textContent = `Uploading... ${i + 1}/${selectedFiles.length}`;
                } catch (error) {
                    console.error('Upload error:', error);
                }
            }

            // Create event
            status.textContent = 'Creating event...';
            try {
                const eventResponse = await fetch('/api/events/manual', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: eventName,
                        photo_ids: photoIds,
                        photo_count: photoIds.length
                    }),
                    credentials: 'include'
                });

                const eventData = await eventResponse.json();

                // Show QR code
                document.getElementById('qrImage').src = eventData.qr_code_url;
                document.getElementById('qrContainer').style.display = 'block';
                status.style.display = 'none';
                progressBar.style.display = 'none';
            } catch (error) {
                status.textContent = 'Error creating event: ' + error.message;
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
