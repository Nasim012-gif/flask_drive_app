<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GetPhotos</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0F0F1A;
            --bg-card: #1A1A2E;
            --primary: #8B5CF6;
            --primary-hover: #7C3AED;
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --card-border: rgba(139, 92, 246, 0.15);
            --input-bg: rgba(15, 15, 26, 0.8);
            --error: #EF4444;
            --success: #10B981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', sans-serif;
        }

        body {
            background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-container {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #fff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        h2 {
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .divider {
            text-align: center;
            color: var(--text-secondary);
            margin: 1.5rem 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--card-border);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .alt-action {
            text-align: center;
            color: var(--text-secondary);
        }

        .alt-action a {
            color: var(--primary);
            text-decoration: none;
        }

        .alt-action a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .storage-info {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .storage-info span {
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="logo">
            <img src="/static/images/logo.jpg" alt="GetPhotos Logo"
                style="height: 60px; width: auto; border-radius: 12px; margin-bottom: 1rem;">
            <h1>GetPhotos</h1>
            <p>Professional Event Photography Platform</p>
        </div>

        <h2>Create Your Account</h2>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <div class="storage-info">
            🎉 Get <span>5 GB</span> free cloud storage for your photos!
        </div>

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="At least 6 characters"
                    minlength="6">
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="divider">or</div>

        <p class="alt-action">
            Already have an account? <a href="/login">Sign in</a>
        </p>
    </div>
</body>

</html>
